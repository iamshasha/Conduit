name: ci

# Compile-checks the core on every OS so the cross-platform backends don't rot.
# (Windows is the primary target and also builds the release; here we prove the
# Linux and macOS cores keep building.)
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

  # Compile-check the macOS Swift GUI so it can't drift from the core protocol.
  macos-gui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift GUI
        run: ./packaging/macos/build-gui.sh
