name: release

# Push a tag like v0.1.0 to build installers and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            rust: x86_64-pc-windows-msvc
            rid: win-x64
          - arch: arm64
            rust: aarch64-pc-windows-msvc
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build core
        run: cargo build --release --target ${{ matrix.rust }}

      - name: Publish GUI
        run: dotnet publish gui-winui -c Release -r ${{ matrix.rid }} -o gui-winui/publish

      - name: Assemble
        shell: pwsh
        run: |
          $out = "Conduit-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$out/gui" | Out-Null
          Copy-Item "target/${{ matrix.rust }}/release/conduit.exe" "$out/"
          Copy-Item "gui-winui/publish/*" "$out/gui/" -Recurse
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Conduit-${{ matrix.arch }}
          path: Conduit-${{ matrix.arch }}.zip

  release:
    needs: windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

# macOS (SwiftUI) and Linux (GTK) targets are intentionally absent: they need a
# cross-platform core (system.rs, GPU, audio, media, elevation, autostart are
# Win32/WinRT today). Add jobs here once those backends exist behind cfg gates.
