name: release

# Push a tag like v0.1.0 to build packages for each OS and attach them to a
# GitHub Release. Also runnable on demand (workflow_dispatch) for a dry run —
# the publish job only runs when a tag triggered it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            rust: x86_64-pc-windows-msvc
            rid: win-x64
          - arch: arm64
            rust: aarch64-pc-windows-msvc
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build core
        run: cargo build --release --target ${{ matrix.rust }}

      - name: Publish GUI
        run: dotnet publish gui-winui -c Release -r ${{ matrix.rid }} -o gui-winui/publish

      - name: Assemble
        shell: pwsh
        run: |
          $out = "Conduit-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$out/gui" | Out-Null
          Copy-Item "target/${{ matrix.rust }}/release/conduit.exe" "$out/"
          Copy-Item "gui-winui/publish/*" "$out/gui/" -Recurse
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath "dist/Conduit-${{ matrix.arch }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev libgtk-4-dev librsvg2-bin dpkg-dev

      - name: Build binaries
        run: |
          cargo build --release
          (cd gui-gtk && cargo build --release)

      - name: Render icons
        run: |
          for s in 16 24 32 48 64 128 256 512; do
            rsvg-convert -w $s -h $s assets/conduit.svg -o assets/conduit-$s.png
          done

      - name: Build .deb
        run: ./packaging/linux/build-deb.sh

      - name: Fetch appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

      - name: Build AppImage
        run: APPIMAGETOOL=/tmp/appimagetool ./packaging/linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Icon deps
        run: brew install librsvg
      - name: Build universal core
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/conduit \
            target/x86_64-apple-darwin/release/conduit \
            target/aarch64-apple-darwin/release/conduit
      - name: Build Swift GUI
        run: ./packaging/macos/build-gui.sh
      - name: Assemble .app and .dmg
        run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # ---------------------------------------------------------------- publish
  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

# A styled, modern Windows installer (Velopack is the leading option) plus
# download-and-apply auto-update land here once that approach is settled.
