<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Conduit app mark. The picture is the product: a gated channel that carries a
    request from an outside origin (left, an open ring) into the machine (right,
    a solid node), narrowing through a checkpoint in the middle where consent is
    given. Two-tone flat geometry so it stays legible down to 16px; no gloss.
  -->
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded-square tile, deep slate-indigo. -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#1f2740"/>

  <g clip-path="url(#tile)" fill="none" stroke="#aeb7d6" stroke-width="26" stroke-linecap="round">
    <!-- The channel: outside origin -> checkpoint -> machine. -->
    <path d="M 118 256 H 210" />
    <path d="M 302 256 H 394" />
  </g>

  <!-- Outside origin: an open ring (a request from the web). -->
  <circle cx="118" cy="256" r="42" fill="none" stroke="#aeb7d6" stroke-width="26"/>

  <!-- The machine endpoint: a solid node. -->
  <circle cx="394" cy="256" r="30" fill="#7c8cf0"/>

  <!-- Consent checkpoint: a gate the channel passes through, accent-filled. -->
  <rect x="216" y="196" width="80" height="120" rx="24" ry="24" fill="#7c8cf0"/>
  <!-- The gap in the gate, cut in the tile colour, that the channel threads. -->
  <rect x="240" y="238" width="32" height="36" rx="10" ry="10" fill="#1f2740"/>
</svg>
