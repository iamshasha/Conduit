<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebShell</title>
<style>
  /* Palette adapts to the Mica backdrop; surfaces stay translucent so the
     window vibrancy shows through. */
  :root {
    --bg: #eef2f0;
    --bg2: #e2e8e4;
    --accent: #2f9e6e;
    --accent-strong: #26875d;
    --danger: #d9534f;
    --text: #16281f;
    --muted: #5c6f66;
    --line: rgba(20, 40, 30, 0.14);
    --card: #ffffff;
    --card-solid: #ffffff;
    --hover: rgba(47, 158, 110, 0.12);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    --radius: 14px;
    color-scheme: light;
  }
  :root.dark {
    --bg: #161d1a;
    --bg2: #1c2521;
    --accent: #4fd39a;
    --accent-strong: #3cbf87;
    --danger: #ff6b6b;
    --text: #e7f3ec;
    --muted: #9fb3aa;
    --line: rgba(255, 255, 255, 0.10);
    --card: #1f2a25;
    --card-solid: #232f29;
    --hover: rgba(79, 211, 154, 0.16);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { background: var(--bg); }
  body {
    font: 14px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg), var(--bg2));
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  a { color: var(--accent); }
  ::selection { background: var(--hover); }

  /* Everything fades in when a view mounts. */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------------- dashboard shell ---------------- */
  #app { display: grid; grid-template-columns: 210px 1fr; height: 100vh; }
  aside {
    background: var(--card);
    border-inline-end: 1px solid var(--line);
    padding: 18px 12px; display: flex; flex-direction: column; gap: 4px;
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(160deg, #3fb27f, #1f6e4c);
    display: grid; place-items: center; color: #fff; font-weight: 700;
    box-shadow: var(--shadow); font-family: ui-monospace, monospace;
  }
  .brand b { font-size: 15px; letter-spacing: .2px; }
  .brand span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 12px; border-radius: 10px; color: var(--muted);
    transition: background .18s, color .18s; text-align: start;
  }
  nav button .ico { width: 18px; text-align: center; opacity: .9; }
  nav button:hover { background: var(--hover); color: var(--text); }
  nav button.active { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
  aside .spacer { flex: 1; }
  .statuschip {
    font-size: 11px; color: var(--muted); padding: 8px 10px; border-radius: 9px;
    background: var(--card-solid); display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,158,110,.5); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  main { overflow-y: auto; padding: 24px 28px; }
  .view { animation: rise .28s ease both; }
  .view h1 { font-size: 20px; margin: 0 0 2px; }
  .view .sub { color: var(--muted); margin: 0 0 20px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; backdrop-filter: blur(6px); animation: pop .3s ease both;
  }
  .card h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  .metric { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .metric small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .bar { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .cores { display: flex; gap: 3px; margin-top: 10px; height: 34px; align-items: flex-end; }
  .cores > i { flex: 1; background: var(--accent); border-radius: 2px; transition: height .4s ease, opacity .4s; opacity: .85; min-height: 2px; }

  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); margin-bottom: 10px; animation: slideIn .25s ease both; }
  .row .grow { flex: 1; min-width: 0; }
  .row .site { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 12px; color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--hover); color: var(--accent-strong); white-space: nowrap; }
  :root.dark .pill { color: var(--accent); }

  .btn { padding: 8px 14px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600;
    transition: transform .12s, filter .18s, box-shadow .18s; box-shadow: var(--shadow); }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: var(--card-solid); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--hover); }
  .btn.danger { background: var(--danger); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; animation: pop .3s ease both; }
  .empty .big { font-size: 40px; opacity: .35; margin-bottom: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: start; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .4px; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card-solid); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr td .site { font-weight: 500; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; }
  .tag.ok { background: rgba(47,158,110,.16); color: var(--accent-strong); }
  .tag.no { background: rgba(217,83,79,.16); color: var(--danger); }
  :root.dark .tag.ok { color: var(--accent); }

  .field { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field label { font-weight: 500; }
  .field .hint { font-size: 12px; color: var(--muted); }
  select { font: inherit; color: inherit; background: var(--card-solid); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; min-width: 150px; }
  .seg { display: inline-flex; background: var(--card-solid); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { padding: 7px 14px; color: var(--muted); transition: background .15s, color .15s; }
  .seg button.on { background: var(--accent); color: #fff; }
  .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  /* pointer-events: none — the track is drawn above the hidden checkbox and
     must not swallow the click meant for it. */
  .track { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: background .2s; pointer-events: none; }
  .track::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px;
    background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  :root[dir="rtl"] .switch input:checked + .track::after { transform: translateX(-18px); }

  .codebox { display: flex; gap: 8px; align-items: center; background: var(--card-solid); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12.5px; margin: 12px 0; }
  .codebox code { flex: 1; overflow-x: auto; white-space: nowrap; -webkit-user-select: text; user-select: text; }
  .warnbox { background: rgba(217,83,79,.1); border: 1px solid rgba(217,83,79,.3); border-radius: 12px; padding: 12px 14px; margin: 14px 0; font-size: 13px; }

  /* toast */
  #toast { position: fixed; bottom: 22px; inset-inline: 0; display: flex; justify-content: center; pointer-events: none; z-index: 50; }
  #toast .t { background: var(--card-solid); border: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 10px 18px; border-radius: 12px; animation: pop .25s ease both; backdrop-filter: blur(8px); }

  /* ---------------- consent window ---------------- */
  #consent { height: 100vh; display: flex; flex-direction: column; padding: 22px; gap: 0; }
  .cwrap { flex: 1; display: flex; flex-direction: column; }
  .cstack { position: relative; flex: 1; }
  .csheet { animation: pop .3s ease both; display: flex; flex-direction: column; height: 100%; }
  .csheet.leaving { animation: leave .3s ease forwards; }
  @keyframes leave { to { opacity: 0; transform: scale(.94); } }
  .cicon { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 30px;
    background: var(--hover); margin-bottom: 14px; }
  .cicon.warn { background: rgba(217,83,79,.14); }
  .ctitle { font-size: 18px; font-weight: 650; margin: 0 0 6px; }
  .corigin { color: var(--accent-strong); word-break: break-all; }
  :root.dark .corigin { color: var(--accent); }
  .cdetail { background: var(--card-solid); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font-family: ui-monospace, monospace; font-size: 12.5px; margin: 14px 0; word-break: break-all;
    -webkit-user-select: text; user-select: text; max-height: 120px; overflow-y: auto; }
  .permlist { flex: 1; overflow-y: auto; margin: 6px 0; }
  .permrow { display: flex; gap: 12px; align-items: flex-start; padding: 11px 12px; border-radius: 11px;
    border: 1px solid var(--line); margin-bottom: 8px; transition: background .15s, border-color .15s; }
  .permrow:hover { background: var(--hover); }
  .permrow .pmeta { flex: 1; }
  .permrow .pmeta b { display: block; }
  .permrow .pmeta span { font-size: 12px; color: var(--muted); }
  .cbremember { display: flex; gap: 9px; align-items: center; margin: 6px 2px 12px; font-size: 13px; color: var(--muted); }
  .cactions { display: flex; gap: 10px; padding-top: 6px; }
  .cactions .btn { flex: 1; padding: 12px; justify-content: center; text-align: center; }
  .countdown { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .countdown > i { display: block; height: 100%; background: var(--accent); animation: drain linear forwards; }
  @keyframes drain { from { width: 100%; } to { width: 0; } }
  .queue { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 8px; }

  input[type=checkbox].chk { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; margin-top: 1px; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script>/*__I18N__*/</script>
<script>
(function () {
  "use strict";
  const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const send = (o) => { try { window.ipc.postMessage(JSON.stringify(o)); } catch (e) {} };
  const MODE = window.__WS_MODE || "main";
  const PERMS = ["fs", "hw", "launch", "system", "process", "power", "clipboard", "notify"];

  // Inline line icons (24×24, currentColor). No emoji, no external assets.
  const P = {
    fs: "M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
    hw: "M4 19V10M9 19V5M14 19v-7M19 19v-4",
    launch: "M5 15c0-5 3-9 7-11 4 2 7 6 7 11M9 12a3 3 0 0 1 6 0M7 18l-2 3M17 18l2 3",
    system: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2",
    process: "M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4M9 9h6v6H9z",
    power: "M12 3v9M6.6 6.6a8 8 0 1 0 10.8 0",
    clipboard: "M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1ZM8 6H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2",
    notify: "M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 0 0 4 0",
    overview: "M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 13h7v7H4z",
    sites: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM3 12h18M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-6-3.5-9s1-6.5 3.5-9Z",
    activity: "M4 7h16M4 12h16M4 17h10",
    extension: "M9 3h6v3a2 2 0 0 0 4 0h2v6h-3a2 2 0 0 0 0 4h3v4H9v-3a2 2 0 0 0-4 0H3V9h3a2 2 0 0 0 0-4H3",
    settings: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2",
    shield: "M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z",
    user: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM5 20a7 7 0 0 1 14 0",
    plug: "M9 3v6M15 3v6M7 9h10v3a5 5 0 0 1-10 0zM12 17v4",
    help: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM9.5 9a2.5 2.5 0 0 1 3.5 2.3c0 1.7-2.5 2-2.5 3.7M12 17h.01",
  };
  const svg = (name, size) => {
    const d = P[name] || P.help;
    return `<svg viewBox="0 0 24 24" width="${size || 18}" height="${size || 18}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d.split("M").filter(Boolean).map((seg) => `<path d="M${seg}"/>`).join("")}</svg>`;
  };
  const PERM_ICON = (p) => svg(p, 16);

  // ---- i18n
  let lang = "en", dict = I18N.en;
  function pickLang(pref) {
    if (pref && pref !== "auto" && I18N[pref]) return pref;
    const nav = (navigator.languages || [navigator.language || "en"]);
    for (const raw of nav) {
      const l = raw.toLowerCase();
      if (l.startsWith("zh")) return (l.includes("tw") || l.includes("hk") || l.includes("hant")) ? "zh-Hant" : "zh-Hans";
      const base = l.split("-")[0];
      const hit = Object.keys(I18N).find((k) => k.toLowerCase() === l || k.toLowerCase() === base);
      if (hit) return hit;
    }
    return "en";
  }
  function setLang(pref) {
    lang = pickLang(pref);
    dict = Object.assign({}, I18N.en, I18N[lang]);
    const rtl = !!I18N[lang]._rtl;
    document.documentElement.lang = lang;
    document.documentElement.dir = rtl ? "rtl" : "ltr";
    document.documentElement.setAttribute("dir", rtl ? "rtl" : "ltr");
  }
  const t = (k, vars) => {
    let s = dict[k] != null ? dict[k] : k;
    if (vars) for (const v in vars) s = s.replace("{" + v + "}", vars[v]);
    return s;
  };
  function applyTheme(theme) {
    const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
  }

  function toast(msg) {
    const box = document.getElementById("toast");
    const key = ("toast_" + msg), text = dict[key] || dict[msg] || msg;
    const el = $(`<div class="t">${esc(text)}</div>`);
    box.appendChild(el);
    setTimeout(() => { el.style.animation = "leave .25s ease forwards"; setTimeout(() => el.remove(), 250); }, 2200);
  }

  const fmtBytes = (n) => {
    if (n == null) return "—";
    const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; n = Number(n);
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i ? n.toFixed(1) : n) + " " + u[i];
  };
  const fmtRate = (n) => fmtBytes(n) + "/s";
  const fmtDur = (s) => { s = Number(s); const d = s / 86400 | 0, h = (s % 86400) / 3600 | 0, m = (s % 3600) / 60 | 0;
    return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
  const fmtWhen = (sec) => { if (!sec) return "—"; const d = new Date(sec * 1000);
    return d.toLocaleDateString(lang, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" }); };
  const fmtTime = (sec) => new Date(sec * 1000).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  const root = document.getElementById("root");
  window.WS = { recv };

  // Router of incoming Rust → JS messages.
  function recv(m) {
    if (MODE === "consent") return consentRecv(m);
    return mainRecv(m);
  }

  /* ==================================================================
     MAIN DASHBOARD
     ================================================================== */
  let snap = null, tab = "overview", editing = null, statsTimer = null;

  function mainRecv(m) {
    if (m.type === "snapshot") { snap = m.data; setLang(snap.settings.lang); applyTheme(snap.settings.theme); render(); }
    else if (m.type === "stats") paintStats(m.data);
    else if (m.type === "toast") toast(m.data);
  }

  function render() {
    if (!snap) return;
    if (!root.firstChild || !document.getElementById("app")) mountShell();
    highlightNav();
    const main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(({ overview, sites, activity, extension, settings })[tab]());
    if (tab === "overview") startStats(); else stopStats();
  }

  function mountShell() {
    root.innerHTML = "";
    const nav = (id) => `<button data-tab="${id}" class="navbtn"><span class="ico">${svg(id)}</span>${esc(t("nav_" + id))}</button>`;
    const app = $(`
      <div id="app">
        <aside>
          <div class="brand">
            <div class="logo">&gt;_</div>
            <div><b>${esc(t("app"))}</b><span>${esc(t("tagline"))}</span></div>
          </div>
          <nav>
            ${nav("overview")}${nav("sites")}${nav("activity")}${nav("extension")}${nav("settings")}
          </nav>
          <div class="spacer"></div>
          <div class="statuschip"><span class="dot"></span>${esc(t("status_running", { port: snap.port }))}</div>
        </aside>
        <main id="main"></main>
      </div>`);
    root.appendChild(app);
    app.querySelectorAll(".navbtn").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
  }
  function highlightNav() {
    document.querySelectorAll(".navbtn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  }

  // ---- overview
  function overview() {
    const v = $(`<div class="view"><h1>${esc(t("nav_overview"))}</h1><p class="sub">${esc(t("tagline"))}</p></div>`);
    const elev = $(`<div class="card" style="grid-column:1/-1;display:flex;align-items:center;gap:14px">
        <div style="color:var(--accent);display:flex">${svg(snap.elevated ? "shield" : "user", 28)}</div>
        <div class="grow"><b>${esc(snap.elevated ? t("elevated") : t("not_elevated"))}</b>
          <div class="meta">WebShell v${esc(snap.version)} · 127.0.0.1:${snap.port}</div></div>
        ${snap.elevated ? "" : `<button class="btn ghost sm" id="elevate">${esc(t("request_admin"))}</button>`}
      </div>`);
    const grid = $(`<div class="grid" style="margin-top:16px"></div>`);
    grid.append(
      statCard("cpu", t("cpu"), `<div class="metric" id="cpu">0<small>%</small></div><div class="cores" id="cores"></div>`),
      statCard("mem", t("memory"), `<div class="metric" id="mem">—</div><div class="bar"><i id="membar" style="width:0"></i></div>`),
      statCard("net", t("network"), `<div class="metric" style="font-size:18px">↓ <span id="rx">—</span></div><div class="metric" style="font-size:18px">↑ <span id="tx">—</span></div>`),
      statCard("bat", t("battery"), `<div id="bat" class="metric" style="font-size:18px">—</div><div class="meta" style="margin-top:6px">${esc(t("uptime"))}: <span id="up">—</span></div>`)
    );
    v.append(elev, grid);
    setTimeout(() => { const e = document.getElementById("elevate"); if (e) e.onclick = () => send({ cmd: "elevate" }); }, 0);
    return v;
  }
  const statCard = (id, title, body) => $(`<div class="card"><h3>${esc(title)}</h3>${body}</div>`);

  function startStats() { paintStats(snap.stats0 || null); stopStats(); statsTimer = setInterval(() => send({ cmd: "stats" }), 1500); send({ cmd: "stats" }); }
  function stopStats() { if (statsTimer) { clearInterval(statsTimer); statsTimer = null; } }
  function paintStats(s) {
    if (!s) return;
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.innerHTML = v; };
    set("cpu", `${Math.round(s.cpu)}<small>%</small>`);
    const cores = document.getElementById("cores");
    if (cores) {
      if (cores.children.length !== s.cores.length) cores.innerHTML = s.cores.map(() => "<i></i>").join("");
      [...cores.children].forEach((el, i) => { const p = s.cores[i] || 0; el.style.height = Math.max(2, p) + "%"; el.style.opacity = .5 + p / 200; });
    }
    set("mem", `${fmtBytes(s.mem_used)} <small>/ ${fmtBytes(s.mem_total)}</small>`);
    const mb = document.getElementById("membar"); if (mb) mb.style.width = (100 * s.mem_used / s.mem_total).toFixed(1) + "%";
    set("rx", fmtRate(s.net_rx)); set("tx", fmtRate(s.net_tx));
    set("up", fmtDur(s.uptime));
    const b = s.battery;
    set("bat", !b || !b.present ? esc(t("no_battery"))
      : `${b.percent != null ? b.percent + "%" : "—"} <small>${esc(b.charging ? t("charging") : b.on_ac ? t("on_ac") : t("on_battery"))}</small>`);
  }

  // ---- sites
  function sites() {
    const v = $(`<div class="view"><h1>${esc(t("nav_sites"))}</h1><p class="sub">${esc(t("sites_hint"))}</p></div>`);
    const list = snap.grants || [];
    if (!list.length) { v.appendChild($(`<div class="empty"><div class="big" style="color:var(--muted);display:flex;justify-content:center">${svg("sites",44)}</div>${esc(t("sites_none"))}</div>`)); return v; }
    list.forEach((g) => v.appendChild(siteRow(g)));
    return v;
  }
  function siteRow(g) {
    if (editing === g.origin) return siteEditor(g);
    const pills = g.perms.map((p) => `<span class="pill">${PERM_ICON(p)} ${esc(t("perm_" + p))}</span>`).join("");
    const apps = (g.launch_allow || []).map((a) =>
      `<div class="meta" style="display:flex;gap:8px;align-items:center;margin-top:4px">
         <code style="flex:1;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:text;user-select:text">${esc(a)}</code>
         <button class="btn ghost sm forget" data-app="${esc(a)}">${esc(t("forget"))}</button></div>`).join("");
    const row = $(`<div class="row" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="grow"><div class="site">${esc(g.origin)}</div>
            <div class="meta">${esc(t("col_lastused"))}: ${esc(fmtWhen(g.last_used))}</div>
            <div class="pills">${pills || `<span class="meta">${esc(t("none"))}</span>`}</div></div>
          <button class="btn ghost sm" data-a="files">${esc(t("open_sandbox"))}</button>
          <button class="btn ghost sm" data-a="edit">${esc(t("edit_perms"))}</button>
          <button class="btn danger sm" data-a="revoke">${esc(t("revoke"))}</button>
        </div>
        ${apps ? `<div style="margin-top:8px"><div class="meta">${esc(t("remembered_apps"))}</div>${apps}</div>` : ""}
      </div>`);
    row.querySelector('[data-a="files"]').onclick = () => send({ cmd: "open_sandbox", origin: g.origin });
    row.querySelector('[data-a="edit"]').onclick = () => { editing = g.origin; render(); };
    row.querySelector('[data-a="revoke"]').onclick = () => { send({ cmd: "revoke", origin: g.origin }); toast("revoked"); };
    row.querySelectorAll(".forget").forEach((b) => b.onclick = () => send({ cmd: "forget_app", origin: g.origin, path: b.dataset.app }));
    return row;
  }
  function siteEditor(g) {
    const rows = PERMS.map((p) => `
      <label class="permrow" style="cursor:pointer">
        <input type="checkbox" class="chk" value="${p}" ${g.perms.includes(p) ? "checked" : ""}>
        <div class="pmeta"><b>${PERM_ICON(p)} ${esc(t("perm_" + p))}</b><span>${esc(t("perm_" + p + "_d"))}</span></div>
      </label>`).join("");
    const box = $(`<div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
        <div class="site">${esc(g.origin)}</div><div>${rows}</div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn ghost sm" data-a="cancel">${esc(t("cancel"))}</button>
          <button class="btn sm" data-a="save">${esc(t("save"))}</button></div>
      </div>`);
    box.querySelector('[data-a="cancel"]').onclick = () => { editing = null; render(); };
    box.querySelector('[data-a="save"]').onclick = () => {
      const perms = [...box.querySelectorAll(".chk:checked")].map((c) => c.value);
      send({ cmd: "set_perms", origin: g.origin, perms }); editing = null; toast("saved");
      const gg = snap.grants.find((x) => x.origin === g.origin); if (gg) gg.perms = perms; render();
    };
    return box;
  }

  // ---- activity
  function activity() {
    const v = $(`<div class="view"><div style="display:flex;align-items:center;justify-content:space-between">
        <h1>${esc(t("nav_activity"))}</h1><button class="btn ghost sm" id="clr">${esc(t("clear"))}</button></div>
        <p class="sub">&nbsp;</p></div>`);
    const a = snap.activity || [];
    if (!a.length) v.appendChild($(`<div class="empty"><div class="big" style="color:var(--muted);display:flex;justify-content:center">${svg("activity",44)}</div>${esc(t("activity_none"))}</div>`));
    else {
      const tbl = $(`<div class="card" style="padding:0;overflow:hidden"><table><thead><tr>
          <th>${esc(t("col_time"))}</th><th>${esc(t("col_site"))}</th><th>${esc(t("col_method"))}</th><th>${esc(t("col_result"))}</th>
        </tr></thead><tbody></tbody></table></div>`);
      const tb = tbl.querySelector("tbody");
      a.forEach((r) => tb.appendChild($(`<tr>
          <td>${esc(fmtTime(r.ts))}</td><td class="site">${esc(r.origin)}</td>
          <td><code style="-webkit-user-select:text;user-select:text">${esc(r.method)}</code></td>
          <td>${r.ok ? `<span class="tag ok">${esc(t("ok"))}</span>` : `<span class="tag no">${esc(r.code || t("failed"))}</span>`}</td>
        </tr>`)));
      v.appendChild(tbl);
    }
    setTimeout(() => { const c = document.getElementById("clr"); if (c) c.onclick = () => send({ cmd: "clear_activity" }); }, 0);
    return v;
  }

  // ---- extension
  function extension() {
    const v = $(`<div class="view"><h1>${esc(t("ext_title"))}</h1><p class="sub">${esc(t("ext_body"))}</p></div>`);
    const url = snap.ext_url;
    v.appendChild($(`<div class="codebox"><code>${esc(url)}</code>
        <button class="btn sm" id="copy">${esc(t("ext_copy"))}</button></div>`));
    const tw = "https://turbowarp.org/editor?extension=" + encodeURIComponent(url);
    v.appendChild($(`<div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn" id="open">${esc(t("ext_open"))}</button></div>`));
    v.querySelector("#copy").onclick = () => { send({ cmd: "copy", text: url }); toast("copied"); };
    v.querySelector("#open").onclick = () => send({ cmd: "open_url", url: tw });
    return v;
  }

  // ---- settings
  function settings() {
    const s = snap.settings;
    const v = $(`<div class="view"><h1>${esc(t("nav_settings"))}</h1><p class="sub">&nbsp;</p></div>`);
    const card = $(`<div class="card"></div>`);
    // language
    const langs = Object.keys(I18N).map((k) => `<option value="${k}" ${s.lang === k ? "selected" : ""}>${esc(I18N[k]._name)}</option>`).join("");
    const langField = $(`<div class="field"><label>${esc(t("settings_language"))}</label>
        <select id="lang"><option value="auto" ${s.lang === "auto" ? "selected" : ""}>Auto</option>${langs}</select></div>`);
    // theme
    const themeField = $(`<div class="field"><label>${esc(t("settings_theme"))}</label>
        <div class="seg" id="theme">
          <button data-v="system" class="${s.theme === "system" ? "on" : ""}">${esc(t("theme_system"))}</button>
          <button data-v="light" class="${s.theme === "light" ? "on" : ""}">${esc(t("theme_light"))}</button>
          <button data-v="dark" class="${s.theme === "dark" ? "on" : ""}">${esc(t("theme_dark"))}</button>
        </div></div>`);
    const toggle = (id, label, checked) => $(`<div class="field"><label>${esc(label)}</label>
        <span class="switch"><input type="checkbox" id="${id}" ${checked ? "checked" : ""}><span class="track"></span></span></div>`);
    const tray = toggle("tray", t("settings_tray"), s.close_to_tray);
    const auto = toggle("autostart", t("settings_autostart"), snap.autostart);
    const proto = toggle("protocol", t("settings_protocol"), snap.protocol);
    const actions = $(`<div class="field" style="border:0"><div>
        <button class="btn ghost sm" id="opendata">${esc(t("open_data"))}</button></div>
        <button class="btn danger sm" id="quit">${esc(t("quit"))}</button></div>`);
    card.append(langField, themeField, tray, auto, proto, actions);
    v.appendChild(card);

    const save = () => {
      const set = {
        lang: langField.querySelector("#lang").value,
        theme: themeField.querySelector(".on").dataset.v,
        close_to_tray: tray.querySelector("#tray").checked,
      };
      snap.settings = set; send({ cmd: "settings", settings: set });
      setLang(set.lang); applyTheme(set.theme);
    };
    langField.querySelector("#lang").onchange = () => { save(); render(); };
    themeField.querySelectorAll("button").forEach((b) => b.onclick = () => {
      themeField.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); save();
    });
    tray.querySelector("#tray").onchange = save;
    auto.querySelector("#autostart").onchange = (e) => send({ cmd: "autostart", on: e.target.checked });
    proto.querySelector("#protocol").onchange = (e) => send({ cmd: "protocol", on: e.target.checked });
    actions.querySelector("#opendata").onclick = () => send({ cmd: "open_data" });
    actions.querySelector("#quit").onclick = () => send({ cmd: "quit" });
    return v;
  }

  /* ==================================================================
     CONSENT WINDOW
     ================================================================== */
  let queue = [], cset = null;

  function consentRecv(m) {
    if (m.type === "settings") { setLang(m.data.lang); applyTheme(m.data.theme); }
    else if (m.type === "consents") { queue = m.data.slice(); showNext(); }
    else if (m.type === "consent_add") { if (!queue.find((q) => q.id === m.data.id)) queue.push(m.data); if (!cset) showNext(); }
    else if (m.type === "consent_gone") { queue = queue.filter((q) => q.id !== m.data); if (cset && cset.id === m.data) leaveThen(showNext); }
  }

  function answer(req, allow, opts) {
    opts = opts || {};
    send({ cmd: "consent", id: req.id, allow, remember: !!opts.remember,
           perms: opts.perms || (allow ? req.perms : []) });
    queue = queue.filter((q) => q.id !== req.id);
    leaveThen(showNext);
  }
  function leaveThen(fn) {
    const el = document.querySelector(".csheet");
    if (el) { el.classList.add("leaving"); setTimeout(fn, 260); } else fn();
  }
  function showNext() {
    cset = queue[0] || null;
    if (!cset) { root.innerHTML = ""; send({ cmd: "consent_done" }); return; }
    renderConsent(cset);
  }

  const POWER_VERB = {
    lock: { en: "lock" }, sleep: { en: "sleep" }, logoff: { en: "sign out of" },
    shutdown: { en: "shut down" }, restart: { en: "restart" },
  };

  function renderConsent(req) {
    root.innerHTML = "";
    const wrap = $(`<div id="consent"><div class="cwrap"><div class="cstack"></div>
        ${queue.length > 1 ? `<div class="queue">+${queue.length - 1}</div>` : ""}</div></div>`);
    const stack = wrap.querySelector(".cstack");
    stack.appendChild(req.kind === "pair" ? pairSheet(req) : actionSheet(req));
    root.appendChild(wrap);
  }

  function header(req, icon, warn, titleKey, extra) {
    const actionWord = req.data && req.data.action ? t("perm_power") : "";
    const title = t(titleKey, { origin: "", action: req.data && req.data.action ? (POWER_VERB[req.data.action] ? req.data.action : req.data.action) : "" });
    return `<div class="cicon ${warn ? "warn" : ""}">${icon}</div>
      <div class="ctitle">${esc(title.replace(":", ""))}</div>
      <div class="corigin">${esc(req.origin)}</div>${extra || ""}`;
  }

  function countdown(req) {
    return `<div class="countdown"><i style="animation-duration:${req.expires_in}s"></i></div>`;
  }

  function pairSheet(req) {
    const rows = req.perms.map((p) => `
      <label class="permrow" style="cursor:pointer">
        <input type="checkbox" class="chk" value="${p}" checked>
        <div class="pmeta"><b>${PERM_ICON(p)} ${esc(t("perm_" + p))}</b><span>${esc(t("perm_" + p + "_d"))}</span></div>
      </label>`).join("");
    const el = $(`<div class="csheet">
        <div class="cicon">${svg("plug",30)}</div>
        <div class="ctitle">${esc(t("consent_pair", { origin: "" }).replace(req.origin, "").trim())}</div>
        <div class="corigin">${esc(req.origin)}</div>
        <p class="sub" style="margin:12px 0 4px">${esc(t("consent_pair_sub"))}</p>
        <div class="permlist">${rows}</div>
        ${countdown(req)}
        <div class="cactions">
          <button class="btn ghost" data-a="deny">${esc(t("deny"))}</button>
          <button class="btn" data-a="allow">${esc(t("allow"))}</button>
        </div></div>`);
    el.querySelector('[data-a="deny"]').onclick = () => answer(req, false);
    el.querySelector('[data-a="allow"]').onclick = () => {
      const perms = [...el.querySelectorAll(".chk:checked")].map((c) => c.value);
      answer(req, perms.length > 0, { perms });
    };
    return el;
  }

  function actionSheet(req) {
    const map = {
      launch: { icon: svg("launch", 30), warn: false, title: "consent_launch" },
      kill: { icon: svg("process", 30), warn: true, title: "consent_kill" },
      power: { icon: svg("power", 30), warn: true, title: "consent_power" },
      clipboard: { icon: svg("clipboard", 30), warn: false, title: "consent_clipboard" },
      elevate: { icon: svg("shield", 30), warn: true, title: "consent_elevate" },
    };
    const c = map[req.kind] || { icon: svg("help", 30), warn: false, title: "consent_title" };
    let title = t(c.title, { origin: req.origin, action: req.data && req.data.action ? req.data.action : "" });
    const detail = req.detail ? `<div class="cdetail">${esc(req.detail)}</div>` : "";
    const remember = req.can_remember
      ? `<label class="cbremember"><input type="checkbox" class="chk" id="remember"><span>${esc(t("remember_app"))}</span></label>` : "";
    const el = $(`<div class="csheet">
        <div class="cicon ${c.warn ? "warn" : ""}">${c.icon}</div>
        <div class="ctitle">${esc(title)}</div>
        ${detail}${remember}
        <div class="spacer" style="flex:1"></div>
        ${countdown(req)}
        <div class="cactions">
          <button class="btn ghost" data-a="deny">${esc(t("deny"))}</button>
          <button class="btn ${c.warn ? "danger" : ""}" data-a="allow">${esc(req.can_remember ? t("allow_once") : t("allow"))}</button>
        </div></div>`);
    el.querySelector('[data-a="deny"]').onclick = () => answer(req, false);
    el.querySelector('[data-a="allow"]').onclick = () => {
      const rem = el.querySelector("#remember");
      answer(req, true, { remember: rem && rem.checked });
    };
    return el;
  }

  // ---- boot
  setLang(navigator.language);
  applyTheme("system");
  send({ cmd: "ready" });
})();
</script>
</body>
</html>
