[package]
name = "conduit"
version = "1.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
dirs = "5"
tao = "0.37.0"
tray-icon = "0.25.1"
arboard = "3.6.1"
notify-rust = "4.18.0"
# native-tls => Windows Schannel: no bundled C/asm crypto (ring/aws-lc), so it
# cross-compiles to aarch64-pc-windows-msvc without clang.
ureq = { version = "3.4.2", default-features = false, features = ["json", "native-tls", "gzip"] }
aes-gcm = "0.11.1"
# Sandbox export/import. deflate only — no bzip2/zstd/aes — to stay small.
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Security", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Pipes", "Win32_System_Performance"] }
winreg = "0.56.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Media_Control", "Foundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
# Windows installer + self-update. The startup hook must run first in main().
velopack = "1.2"

# Embed the app icon into conduit.exe so Windows Search/Explorer/taskbar show it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
tungstenite = "0.24"

[profile.release]
strip = true
lto = true
codegen-units = 1

